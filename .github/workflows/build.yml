name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev libhidapi-dev

      - name: Build Android application
        run: |
          chmod +x ./gradlew
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk ./gradlew --no-daemon clean build assembleDebugApk

      - name: Build native binary
        run: |
          make clean
          make

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: |
            app/build/outputs/apk/debug/*.apk
            steam-haptics-singer

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/steam-haptics-singer
